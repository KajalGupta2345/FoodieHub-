name: foodie-Hub

on: 
 push:
   branches:
     - main
     
concurrency:
    group : deploy
    cancel-in-progress : true

jobs:
  build:
    runs-on: ubuntu-latest    

    steps:
        - name: Checkout
          uses: actions/checkout@v6.0.3
           
        - name: Setup Node.js environment
          uses: actions/setup-node@v6.4.0

        - name: Install Dependencies
          run: npm install

        - name: Build react-js
          run : npm run build

        - name:  Deploy App
          run: echo "Deploying app...."
